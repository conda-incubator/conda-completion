context:
  version: "0.1.0"
  python_min: "3.10"

recipe:
  name: conda-completion-split
  version: ${{ version }}

source:
  path: ..

build:
  number: 0

outputs:
  - package:
      name: conda-completer
      version: ${{ version }}
    build:
      number: 0
      python:
        version_independent: true
      script:
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
          CARGO_PROFILE_RELEASE_LTO: fat
        content:
          - if: unix
            then:
              - ${{ PYTHON }} -m pip install packages/conda-completer -vv --no-deps --no-build-isolation
            else:
              - ${{ PYTHON }} -m pip install packages\conda-completer -vv --no-deps --no-build-isolation
    requirements:
      build:
        - maturin >=1.0,<2.0
        - ${{ compiler('rust') }}
        - ${{ stdlib('c') }}
        - if: build_platform != target_platform
          then:
            - python ${{ python_min }}.*
            - cross-python_${{ target_platform }}
      host:
        - python ${{ python_min }}.*
        - pip
        - maturin >=1.0,<2.0
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - conda_completer
          pip_check: false
      - package_contents:
          files:
            - python-scripts/_conda_completer*

  - package:
      name: conda-completion
      version: ${{ version }}
    build:
      number: 0
      noarch: python
      script:
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
        content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
      python:
        entry_points:
          - cc = conda_completion.__main__:main
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python ${{ python_min }}.*
            - cross-python_${{ target_platform }}
      host:
        - python ${{ python_min }}.*
        - pip
        - hatchling >=1.12.2
        - hatch-vcs >=0.2.0
      run:
        - python >=${{ python_min }}
        - conda >=25.1
        - conda-completer ==${{ version }}
        - platformdirs >=4.0
        - tomli >=2.0
        - tomli-w >=1.0
    tests:
      - python:
          imports:
            - conda_completion
            - conda_completion.plugin
          pip_check: false
          python_version: ${{ python_min }}.*
      - script:
          - cc --help

about:
  homepage: https://github.com/conda-incubator/conda-completion
  repository: https://github.com/conda-incubator/conda-completion
  license: BSD-3-Clause
  license_file: LICENSE
  summary: >
    Fast shell tab completion for conda and all its plugins.
