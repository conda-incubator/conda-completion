[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "conda-completer"
version = "0.2.0"
description = "Fast completion engine for conda -- reads a msgpack manifest and project files to produce TAB candidates"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Jannis Leidel", email = "jannis@leidel.info" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Rust",
]

[project.urls]
repository = "https://github.com/conda-incubator/conda-completion"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
module-name = "conda_completer"
python-source = "python"
strip = true
locked = true
