[package]
name = "conda-completer"
version = "0.3.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Fast completion engine for conda -- reads a msgpack manifest and project files to produce TAB candidates"
repository = "https://github.com/conda-incubator/conda-completion"

[[bin]]
name = "_conda_completer"
path = "src/main.rs"

[dependencies]
rmp-serde = "1"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3"
toml = "0.8"
serde-saphyr = "0.0"

[dev-dependencies]
test-case = "3"
