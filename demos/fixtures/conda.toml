[project]
name = "my-project"
channels = ["conda-forge"]

[environments.default]
dependencies = ["python >=3.12"]

[environments.test]
dependencies = ["python >=3.12", "pytest"]

[environments.docs]
dependencies = ["python >=3.12", "sphinx"]

[tasks.test]
cmd = "pytest tests/"
environment = "test"

[tasks.build-docs]
cmd = "sphinx-build docs docs/_build"
environment = "docs"

[tasks.lint]
cmd = "ruff check src/"
