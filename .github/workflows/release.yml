name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_id:
        description: Release workflow run whose artifacts should be published
        type: number
        required: true

permissions:
  contents: read # checkout and read source code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-completer-wheels:
    name: Completer wheel (${{ matrix.target }})
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2_17"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2_17"
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}-wheel-${{ hashFiles('Cargo.lock') }}

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked -o dist -m packages/conda-completer/Cargo.toml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: completer-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-completer-sdist:
    name: Completer sdist
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -o dist -m packages/conda-completer/Cargo.toml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: completer-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-python:
    name: Python package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - run: pipx run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish-completer:
    name: Publish conda-completer to PyPI
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || success()) }}
    runs-on: ubuntu-latest
    needs: [build-completer-wheels, build-completer-sdist]
    environment: pypi-completer
    outputs:
      tag: ${{ steps.source.outputs.tag }}

    permissions:
      actions: read # download artifacts from a previous release run
      contents: read # verify the release tag
      id-token: write # OIDC trusted publishing to PyPI

    steps:
      - name: Verify the source release run
        if: github.event_name == 'workflow_dispatch'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          source_run=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID")
          jq -e --arg repo "$GH_REPO" '
            .event == "release" and
            .path == ".github/workflows/release.yml" and
            .head_repository.full_name == $repo and
            .status == "completed"
          ' <<< "$source_run"
          tag=$(jq -r .head_branch <<< "$source_run")
          source_sha=$(jq -r .head_sha <<< "$source_run")
          tag_sha=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
          test "$source_sha" = "$tag_sha"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
          pattern: "completer-*"
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}

  publish-python:
    name: Publish conda-completion to PyPI
    if: ${{ !cancelled() && needs.publish-completer.result == 'success' && (github.event_name == 'workflow_dispatch' || success()) }}
    runs-on: ubuntu-latest
    needs: [build-python, publish-completer]
    environment: pypi-completion

    permissions:
      actions: read # download artifacts from a previous release run
      id-token: write # OIDC trusted publishing to PyPI

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
          pattern: "python-dist"
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}

  upload-release-assets:
    name: Upload release assets
    if: ${{ !cancelled() && needs.publish-completer.result == 'success' && needs.publish-python.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [publish-completer, publish-python]

    permissions:
      actions: read # download artifacts from a previous release run
      contents: write # upload assets to GitHub release

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist
          pattern: "{completer-*,python-dist}"
          merge-multiple: true

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name || needs.publish-completer.outputs.tag }}
        run: gh release upload "$TAG_NAME" dist/* --repo "$GH_REPO"
