name: Release

on:
  push:
    tags:
      - '*.*.*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'pyproject.toml'
      - 'pixi.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packages/**'

permissions:
  contents: read # checkout and read source code

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-completer-wheels:
    name: Completer wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2_17"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            manylinux: "2_17"
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}-wheel-${{ hashFiles('Cargo.lock') }}

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked -o dist -m packages/conda-completer/Cargo.toml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: completer-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-completer-sdist:
    name: Completer sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: -o dist -m packages/conda-completer/Cargo.toml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: completer-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          environments: release

      - run: pixi run --locked -e release build-dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  check-distributions:
    name: Check all release distributions
    runs-on: ubuntu-latest
    needs: [build-completer-wheels, build-completer-sdist, build-python]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          environments: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{completer-*,python-dist}"
          merge-multiple: true

      - run: pixi run --locked -e release check-dist

  create-draft-release:
    name: Attach distributions to a draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [check-distributions]
    permissions:
      contents: write # create the draft release and upload its assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{completer-*,python-dist}"
          merge-multiple: true

      - name: Create draft release and upload distributions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          completer_wheels=(dist/conda_completer-"$RELEASE_TAG"-*.whl)
          if [[ "${#files[@]}" -ne 8 || "${#completer_wheels[@]}" -ne 5 ||
                ! -f "dist/conda_completer-${RELEASE_TAG}.tar.gz" ||
                ! -f "dist/conda_completion-${RELEASE_TAG}.tar.gz" ||
                ! -f "dist/conda_completion-${RELEASE_TAG}-py3-none-any.whl" ]]; then
            echo "Expected five completer wheels, one completion wheel, and two source archives for $RELEASE_TAG." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Rerun failed jobs from its original workflow run." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --draft --verify-tag --title "$RELEASE_TAG" --generate-notes --repo "$GH_REPO"

          cleanup_draft() {
            gh release delete "$RELEASE_TAG" --repo "$GH_REPO" --yes >/dev/null 2>&1 || true
          }
          trap cleanup_draft ERR
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GH_REPO"
          trap - ERR

  publish-completer:
    name: Publish conda-completer to PyPI
    runs-on: ubuntu-latest
    needs: [create-draft-release]
    environment: pypi-completer

    permissions:
      id-token: write # OIDC trusted publishing to PyPI

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "completer-*"
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true

  publish-python:
    name: Publish conda-completion to PyPI
    runs-on: ubuntu-latest
    needs: [publish-completer]
    environment: pypi-completion

    permissions:
      id-token: write # OIDC trusted publishing to PyPI

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "python-dist"
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true

  publish-github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [publish-completer, publish-python]

    permissions:
      contents: write # publish the draft after both PyPI uploads succeed

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
