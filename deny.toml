# cargo-deny configuration for conda-completer
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny --manifest-path packages/conda-completer/Cargo.toml check

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Advisory database checks (RustSec)
[advisories]
ignore = [
    # serde_yml and libyml are flagged as unmaintained. We only use serde_yml
    # for reading .condarc and environment.yml during completion -- no untrusted
    # input, minimal attack surface.
    "RUSTSEC-2025-0068",
]

# License policy -- allow only permissive licenses compatible with BSD-3-Clause
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

# Dependency bans
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

# Source restrictions -- crates.io only
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
